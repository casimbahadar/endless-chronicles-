<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --r:8px; --btn:44px;
  --font:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --display:"Cinzel", Georgia, serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0b1024; --bg2:#16204a; --ink:#f2f4ff;
  --w1:#4766d8; --w2:#24358a; --winInk:#ffffff; --winMuted:#cdd6ff; --edge:#e3e8ff; --edgeDark:#111a50; --rowRule:rgba(230,236,255,.2);
  --gold:#f4cb63; --goldDeep:#c58e1f; --goldInk:#2a1900; --bad:#ff9a88; --good:#8ee6a1; --chip:rgba(10,18,70,.45);
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#ece3cf; --bg2:#f7f1e3; --ink:#2a2140;
  --w1:#fffaf0; --w2:#f1e5c9; --winInk:#2a2140; --winMuted:#6b5a3e; --edge:#8a6a36; --edgeDark:#f9f1df; --rowRule:rgba(110,85,40,.22);
  --gold:#b9781a; --goldDeep:#8a5609; --goldInk:#fffaf0; --bad:#b4321f; --good:#2f7d3e; --chip:rgba(138,106,54,.12); } }
:root[data-theme="light"]{
  --bg:#ece3cf; --bg2:#f7f1e3; --ink:#2a2140;
  --w1:#fffaf0; --w2:#f1e5c9; --winInk:#2a2140; --winMuted:#6b5a3e; --edge:#8a6a36; --edgeDark:#f9f1df; --rowRule:rgba(110,85,40,.22);
  --gold:#b9781a; --goldDeep:#8a5609; --goldInk:#fffaf0; --bad:#b4321f; --good:#2f7d3e; --chip:rgba(138,106,54,.12); }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; min-height:100%; background:radial-gradient(120% 90% at 30% 0%, var(--bg2), var(--bg)); color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.35; -webkit-tap-highlight-color:transparent; }
.app{ max-width:760px; margin:0 auto; padding:var(--s3) var(--s3) var(--s5); display:grid; gap:var(--s3); }
.win{ position:relative; color:var(--winInk); background:linear-gradient(180deg,var(--w1),var(--w2)); border-radius:var(--r);
  box-shadow:inset 0 0 0 2px var(--edge), inset 0 0 0 4px var(--edgeDark), 0 3px 0 rgba(0,0,0,.28); }
.head{ display:flex; align-items:center; justify-content:space-between; gap:var(--s3); padding:var(--s2) var(--s4); }
h1{ margin:0; font-family:var(--display); font-size:21px; font-weight:700; white-space:nowrap; letter-spacing:.6px; }
h1 b{ color:var(--gold); font-weight:700; }
.status{ display:flex; gap:var(--s2); flex-wrap:wrap; justify-content:flex-end; }
.chip{ font-size:13px; font-weight:700; padding:3px var(--s2); border-radius:999px; background:var(--chip); box-shadow:inset 0 0 0 1px var(--rowRule); white-space:nowrap; }
.chip strong{ color:var(--gold); font-weight:600; }
.stage{ position:relative; border-radius:var(--r); overflow:hidden; background:#000; box-shadow:0 0 0 2px var(--edge), 0 0 0 5px var(--edgeDark), 0 6px 18px rgba(0,0,0,.45); touch-action:none; }
canvas#cv{ display:block; width:100%; height:auto; aspect-ratio:3/2; image-rendering:pixelated; }
#menu{ position:absolute; top:var(--s2); right:var(--s2); width:min(42%,230px); display:grid; gap:2px; padding:var(--s2); }
#menu.left{ right:auto; left:var(--s2); } #menu.low{ top:auto; bottom:var(--s2); } #menu:empty{ display:none; }
#menu button{ min-height:40px; width:100%; text-align:left; padding:0 var(--s3); background:transparent; box-shadow:none; color:var(--winInk); font-size:16px; }
#menu button:hover, #menu button:focus-visible{ background:rgba(255,255,255,.14); }
#menu button.primary{ background:rgba(244,203,99,.95); color:#2a1900; }
#menu button.quiet{ color:#d6defc; }
.side{ display:grid; gap:var(--s3); align-content:start; }
.hint{ padding:var(--s3) var(--s4); min-height:62px; font-size:16px; font-weight:600; }
.hint #speaker{ color:var(--gold); font-weight:600; margin-right:var(--s1); }
button{ font-family:var(--font); font-size:15px; font-weight:700; line-height:1; color:var(--winInk); min-height:var(--btn); padding:0 var(--s3); border:0; border-radius:var(--r); cursor:pointer;
  background:linear-gradient(180deg,var(--w1),var(--w2)); box-shadow:inset 0 0 0 2px var(--edge), inset 0 0 0 4px var(--edgeDark); }
button:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
button[aria-pressed="true"]{ color:var(--gold); box-shadow:inset 0 0 0 2px var(--gold), inset 0 0 0 4px var(--edgeDark), 0 0 0 2px rgba(244,203,99,.35); }
button.primary{ background:linear-gradient(180deg,var(--gold),var(--goldDeep)); color:var(--goldInk); box-shadow:inset 0 0 0 2px #fff1c4, inset 0 0 0 4px #7a5310; font-weight:600; }
button.quiet{ background:var(--chip); box-shadow:inset 0 0 0 2px var(--rowRule); color:var(--winInk); }
.bar{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--s2); }
.seg{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--s2); }
#cmdRow{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--s2); } #cmdRow[hidden]{ display:none; }
.tabs{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:var(--s1); }
.tabs button{ font-size:13px; padding:0 2px; min-height:38px; }
#panel{ padding:var(--s2) var(--s4); max-height:320px; overflow:auto; font-size:14px; }
.line{ display:grid; grid-template-columns:1fr auto; gap:var(--s2); padding:7px 0; border-bottom:1px solid var(--rowRule); }
.line:last-child{ border-bottom:0; }
.unit{ display:grid; grid-template-columns:1.2fr 1.1fr auto auto; gap:var(--s2); padding:6px 0; border-bottom:1px solid var(--rowRule); align-items:center; }
.unit:last-child{ border-bottom:0; }
.muted{ color:var(--winMuted); } .good{ color:var(--good); } .bad{ color:var(--bad); } .lord{ color:var(--gold); }
.tag{ font-size:11px; font-weight:700; color:var(--winMuted); }
.opt{ display:grid; gap:var(--s2); padding:var(--s2) 0 var(--s3); border-bottom:1px solid var(--rowRule); }
.opt:last-child{ border-bottom:0; } .opt .seg button{ min-height:38px; font-size:14px; }
#gate p{ margin:var(--s2) 0 var(--s3); } #gate{ padding:var(--s4); } #gate .stack{ display:grid; gap:var(--s2); }
.pick{ position:relative; display:block; } .pick input{ position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer; }
.pick span{ display:flex; align-items:center; justify-content:center; min-height:var(--btn); border-radius:var(--r); font-weight:800; background:linear-gradient(180deg,var(--gold),var(--goldDeep)); color:var(--goldInk); box-shadow:inset 0 0 0 2px #fff1c4, inset 0 0 0 4px #7a5310; }
.pick input:focus-visible + span{ outline:3px solid #fff; outline-offset:2px; }
#gateMsg{ color:#ffe1b0; margin:var(--s2) 0 0; }
.credit a{ color:var(--winInk); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
button{ white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis; }
html, body{ overflow-x:hidden; max-width:100%; touch-action:manipulation; }
.app, .side, .stageWrap, #panel, .hint{ min-width:0; } #panel{ overflow-wrap:anywhere; }
.head{ flex-wrap:wrap; } .head h1{ white-space:normal; }
@media (max-width: 430px){ h1{ font-size:18px; } .chip{ font-size:12px; } button{ font-size:14px; } .tabs button{ font-size:12px; } }
.hint{ display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
/* landscape: the map fills the screen height, controls live in a side panel */
@media (orientation: landscape) and (min-width: 640px){
  body{ height:100%; overflow:hidden; }
  .app{ max-width:none; height:100dvh; padding:var(--s2) var(--s3); column-gap:var(--s3); row-gap:var(--s2);
    grid-template-columns:minmax(0, 1fr) clamp(260px, 30vw, 380px); grid-template-rows:auto minmax(0, 1fr);
    grid-template-areas:"stage head" "stage side"; }
  .head{ grid-area:head; flex-wrap:wrap; justify-content:flex-start; padding:var(--s2) var(--s3); row-gap:var(--s1); }
  .head .status{ justify-content:flex-start; }
  #gate{ grid-area:side; z-index:2; }
  .stageWrap{ grid-area:stage; min-height:0; display:flex; align-items:center; justify-content:center; }
  .stage{ height:100%; max-height:100%; aspect-ratio:3/2; width:auto; max-width:100%; }
  canvas#cv{ height:100%; width:auto; max-width:100%; }
  .side{ grid-area:side; min-height:0; display:flex; flex-direction:column; gap:var(--s2); }
  .side > *{ flex:none; }
  .side #panel{ flex:1 1 auto; min-height:0; max-height:none; overflow:auto; }
  .side button{ font-size:14px; padding:0 6px; min-height:40px; }
  .tabs{ grid-template-columns:repeat(3, 1fr); }
  .hint{ min-height:0; padding:var(--s2) var(--s3); font-size:14px; }
}
@media (orientation: landscape) and (min-width: 640px) and (max-height: 520px){
  .app{ padding:var(--s1) var(--s2); row-gap:var(--s1); column-gap:var(--s2); }
  .head{ padding:var(--s1) var(--s2); } h1{ font-size:15px; } .chip{ font-size:11px; padding:2px 6px; }
  .hint{ -webkit-line-clamp:2; font-size:13px; padding:6px var(--s2); }
  .side{ gap:var(--s1); } .side button{ min-height:32px; font-size:12px; }
  .tabs{ grid-template-columns:repeat(5, 1fr); } .tabs button{ font-size:11px; min-height:30px; }
  #panel{ padding:var(--s1) var(--s2); font-size:12px; } .unit{ padding:3px 0; } .tag{ font-size:10px; }
}
/* theater mode: the map fills the screen; a small toolbar floats over it */
.float{ position:absolute; top:8px; right:8px; display:flex; gap:6px; z-index:3; }
.float button{ min-height:34px; font-size:13px; padding:0 10px; background:rgba(12,18,52,.62); color:#fff; box-shadow:inset 0 0 0 1px rgba(255,255,255,.35); backdrop-filter:blur(4px); }
.float #tPause, .float #tSpeed{ display:none; }
.strip{ display:none; position:absolute; left:8px; right:8px; bottom:8px; padding:6px 12px; font-size:15px; font-weight:700; z-index:2; pointer-events:none; }
body.theater .float #tPause, body.theater .float #tSpeed{ display:inline-flex; align-items:center; }
body.theater .strip.on{ display:block; }
body.theater .side, body.theater .head{ display:none !important; }
body.theater .app{ grid-template-columns:1fr !important; grid-template-areas:"stage" !important; grid-template-rows:1fr !important; height:100dvh; padding:4px !important; }
body.theater .stageWrap{ height:100%; display:flex; align-items:center; justify-content:center; }
body.theater .stage{ width:100%; height:100%; max-height:100%; aspect-ratio:auto; display:flex; align-items:center; justify-content:center; background:#000; }
body.theater canvas#cv{ width:100%; height:100%; max-width:100%; max-height:100%; object-fit:contain; aspect-ratio:auto; }
@media (prefers-reduced-motion: reduce){ *{ transition:none!important; animation:none!important; } }
</style>
</head>
<body>
<main class="app">
  <header class="head win"><h1>Endless <b>Chronicle</b></h1><div class="status" id="status" aria-live="polite"><span class="chip">Gathering the army</span></div></header>
  <section id="gate" class="win" hidden>
    <div id="gateTitle" style="color:var(--gold);font-weight:600">Bring your own Sacred Stones</div>
    <p id="gateText">The maps and units come from your own copy of <i>Fire Emblem: The Sacred Stones</i> (US). The file stays on this device.</p>
    <div class="stack" id="gateButtons">
      <label class="pick"><input id="romFile" type="file" accept=".gba,.GBA,application/octet-stream"><span>Choose ROM file</span></label>
      <button id="noRom" class="quiet">Play with simple art</button>
    </div>
    <p id="gateMsg"></p>
  </section>
  <div class="stageWrap"><div class="stage"><canvas id="cv" width="960" height="640" aria-label="Battle map"></canvas><div id="menu" class="win" role="menu"></div><div class="float" id="floatBar"><button id="tPause" class="quiet" aria-label="Pause">Pause</button><button id="tSpeed" class="quiet" aria-label="Speed">2×</button><button id="tTheater" class="quiet" aria-label="Theater mode" aria-pressed="false">Full map</button></div><div class="strip win" id="strip" aria-hidden="true"></div></div></div>
  <aside class="side">
    <div class="hint win" aria-live="polite"><span id="speaker"></span><span id="line">The march is about to begin.</span></div>
    <div class="seg" role="group" aria-label="Who plays your army"><button id="mWatch" aria-pressed="true">Watch</button><button id="mCommand" aria-pressed="false">Command</button></div>
    <div id="cmdRow" hidden><button id="endTurn" class="primary">End turn</button><button id="autoRest">Auto finish</button></div>
    <div class="bar"><button id="pauseBtn">Pause</button><button id="speedBtn">Speed 2×</button><button id="newBtn" class="quiet">New run</button></div>
    <div class="tabs" role="group" aria-label="Panels">
      <button data-tab="army" aria-pressed="true">Army</button><button data-tab="log" aria-pressed="false">Log</button><button data-tab="fallen" aria-pressed="false">Fallen</button><button data-tab="options" aria-pressed="false">Options</button><button data-tab="library" aria-pressed="false">Library</button>
    </div>
    <div id="panel" class="win"></div>
  </aside>
</main>
<script>
// Endless Chronicle engine: generated FE-style campaign that plays itself. No DOM here.
(function (root) {
'use strict';
let W = 15, H = 10;
let ROMD = null;           // { maps:[{ch,w,h,terr}], classes:{id:{mov,def,avo,res,sms}} } decoded from the player's own FE8 ROM
function setRomData(d) { ROMD = d; }

function RNG(seed) {
  let s = seed >>> 0;
  const get = () => s, set = v => { s = v >>> 0; };
  const r = () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  r.int = (a, b) => a + Math.floor(r() * (b - a + 1));
  r.pick = (arr) => arr[Math.floor(r() * arr.length)];
  r.chance = (p) => r() * 100 < p;
  r.getState = get; r.setState = set;
  return r;
}

// ---------------------------------------------------------------- data (placeholder classes)
const TERRAIN = {
  plain:   { name: 'Plain',    cost: { foot: 1, armor: 1, horse: 1, fly: 1 }, def: 0, avo: 0 },
  forest:  { name: 'Forest',   cost: { foot: 2, armor: 2, horse: 3, fly: 1 }, def: 1, avo: 20 },
  hill:    { name: 'Hill',     cost: { foot: 3, armor: 99, horse: 99, fly: 1 }, def: 2, avo: 30 },
  water:   { name: 'River',    cost: { foot: 99, armor: 99, horse: 99, fly: 1 }, def: 0, avo: 0 },
  bridge:  { name: 'Bridge',   cost: { foot: 1, armor: 1, horse: 1, fly: 1 }, def: 0, avo: 0 },
  fort:    { name: 'Fort',     cost: { foot: 2, armor: 2, horse: 2, fly: 1 }, def: 2, avo: 20, heal: 20 },
  village: { name: 'Village',  cost: { foot: 1, armor: 1, horse: 1, fly: 1 }, def: 0, avo: 10 },
  wall:    { name: 'Wall',     cost: { foot: 99, armor: 99, horse: 99, fly: 99 }, def: 0, avo: 0 },
  floor:   { name: 'Floor',    cost: { foot: 1, armor: 1, horse: 1, fly: 1 }, def: 0, avo: 0 },
  throne:  { name: 'Throne',   cost: { foot: 1, armor: 1, horse: 1, fly: 1 }, def: 3, avo: 30, heal: 10 },
};
const WEAPONS = {
  sword: { name: 'Iron Sword', mt: 5, hit: 90, crit: 0, min: 1, max: 1 },
  lance: { name: 'Iron Lance', mt: 7, hit: 80, crit: 0, min: 1, max: 1 },
  axe:   { name: 'Iron Axe',   mt: 8, hit: 75, crit: 0, min: 1, max: 1 },
  bow:   { name: 'Iron Bow',   mt: 6, hit: 85, crit: 0, min: 2, max: 2, effFly: true },
  fire:  { name: 'Fire',       mt: 5, hit: 90, crit: 0, min: 1, max: 2, magic: true },
  staff: { name: 'Heal',       mt: 0, hit: 0, crit: 0, min: 1, max: 1, heal: true },
  dance: { name: 'Dance',      mt: 0, hit: 0, crit: 0, min: 1, max: 1, refresh: true },
  claw:  { name: 'Claws',      mt: 7, hit: 80, crit: 5, min: 1, max: 1 },
  eye:   { name: 'Evil Eye',   mt: 6, hit: 85, crit: 0, min: 1, max: 2, magic: true },
  breath:{ name: 'Breath',     mt: 9, hit: 80, crit: 0, min: 1, max: 1, magic: true },
};
const S = ['hp', 'str', 'mag', 'skl', 'spd', 'lck', 'def', 'res'];
const C = (wpn, mov, mt, base, gr, extra) => Object.assign({ wpn, mov, mt, base, gr }, extra || {});
const b = (hp, str, mag, skl, spd, lck, def, res) => ({ hp, str, mag, skl, spd, lck, def, res });
const CLASSES = {
  Lord:      C('sword', 5, 'foot',  b(18,5,1,7,8,6,4,2),  b(75,45,15,55,60,55,30,30), { lord: true }),
  Mercenary: C('sword', 5, 'foot',  b(18,5,0,8,7,2,4,0),  b(80,45,5,50,45,30,30,20)),
  Myrmidon:  C('sword', 5, 'foot',  b(16,4,0,9,10,3,2,1), b(70,35,5,55,65,40,20,25), { critBonus: 15 }),
  Soldier:   C('lance', 5, 'foot',  b(19,6,0,3,3,1,5,0),  b(80,50,0,35,30,25,40,15)),
  Knight:    C('lance', 4, 'armor', b(20,7,0,3,1,1,10,0), b(85,50,0,35,20,25,55,15)),
  Cavalier:  C('lance', 7, 'horse', b(19,6,0,5,6,3,6,1),  b(80,45,5,45,45,35,30,20)),
  Pegasus:   C('lance', 7, 'fly',   b(15,4,1,6,8,5,3,6),  b(60,35,15,50,60,50,15,50), { flier: true }),
  Fighter:   C('axe',   5, 'foot',  b(22,7,0,4,4,1,3,0),  b(90,60,0,35,40,25,25,10)),
  Brigand:   C('axe',   5, 'foot',  b(21,6,0,2,5,0,2,0),  b(85,55,0,25,40,20,20,5),  { climber: true }),
  Archer:    C('bow',   5, 'foot',  b(17,5,0,6,5,2,3,1),  b(70,45,0,55,45,35,25,20)),
  Mage:      C('fire',  5, 'foot',  b(16,0,5,4,5,3,2,4),  b(65,5,55,45,50,40,15,40)),
  Cleric:    C('staff', 5, 'foot',  b(16,0,4,3,6,6,1,6),  b(55,5,50,35,55,60,10,55), { healer: true }),
};
const FE8_CLASS = { Lord: [0x02, 0x01], Mercenary: [0x0F, 0x10], Myrmidon: [0x13, 0x14], Soldier: [0x4E, 0x4E], Knight: [0x09, 0x0A],
  Cavalier: [0x05, 0x06], Pegasus: [0x48, 0x48], Fighter: [0x3F, 0x3F], Brigand: [0x41, 0x41], Archer: [0x19, 0x1A], Mage: [0x25, 0x26], Cleric: [0x45, 0x4A] };
const PLAYER_POOL = ['Mercenary','Myrmidon','Soldier','Knight','Cavalier','Pegasus','Fighter','Archer','Mage','Cleric'];
const ENEMY_POOL  = ['Mercenary','Myrmidon','Soldier','Knight','Cavalier','Fighter','Brigand','Archer','Mage','Pegasus'];

// ---------------------------------------------------------------- names and text
const SYL1 = ['Ar','Be','Ca','Da','El','Fa','Ga','Hel','Is','Jo','Ka','Le','Ma','Ne','Or','Pe','Ra','Se','Ta','Ul','Va','Wy','Ze','Ro','Li','Mi','Sa','Ti'];
const SYL2 = ['ran','vin','lia','dor','mir','ric','nna','sha','th','ren','gus','ra','ven','lys','mon','dra','is','na','el','ian','os','ka'];
const PLACES1 = ['Ash','Raven','Glen','Thorn','Frost','Ember','Stone','Mist','Iron','Willow','Grey','Amber','Hollow','Storm'];
const PLACES2 = ['ford','moor','vale','watch','reach','mere','crest','fell','haven','gate','wood','march'];
const TITLES = ['Ashes at {p}','The Road to {p}','Siege of {p}','Night over {p}','The {p} Crossing','Blood on {p}','Shadows of {p}','The Fall of {p}','Last Light at {p}','Embers of {p}'];
function uniqueName(camp, rng) {
  if (!(camp.usedNames instanceof Set)) camp.usedNames = new Set([...(camp.army || []).map(u => u.name), ...(camp.fallen || []).map(f => f.name)]);
  for (let i = 0; i < 60; i++) { const n = makeName(rng); if (!camp.usedNames.has(n)) { camp.usedNames.add(n); return n; } }

  <div class="line credit" style="margin-top:8px"><span>Community maps are free-to-use layouts from the <a href="https://github.com/Klokinator/FE-Repo" target="_blank" rel="noopener">FE Repository</a>, drawn with tiles from your own ROMs.</span><span></span></div>${repoRows}`;
}
// what each chosen file is, read lazily: DS games are read in slices, everything else whole
async function filesToRoms(files) {
  const out = [];
  for (const f of files) {
    if (/\.zip$/i.test(f.name)) {
      if (!window.JSZip) { out.push({ name: f.name, none: 'is a zip, and the unzip helper didn\u2019t load. Unzip it and add the game file itself.' }); continue; }
      const z = await JSZip.loadAsync(f); let found = 0;
      for (const e of Object.values(z.files)) if (!e.dir && /\.(gba|nds|sfc|smc|fig)$/i.test(e.name)) { found++; out.push({ name: e.name, load: () => e.async('arraybuffer') }); }
      if (!found) out.push({ name: f.name, none: Object.keys(z.files).some(n => /\.(ips|ups|bps|xdelta|delta)$/i.test(n)) ? 'holds a patch, not a game. Apply it to your own ROM first, then add the patched ROM.' : 'has no game file inside.' });
    } else out.push({ name: f.name, file: f });

}
const sliceReader = f => (o, n) => f.slice(o, o + n).arrayBuffer().then(b => new Uint8Array(b));
async function addOne(r, say) {
  let head;
  if (r.file) head = await sliceReader(r.file)(0, 0x200); else { r.buf = await r.load(); head = new Uint8Array(r.buf, 0, 0x200); }
  const isGBA = head[0xB2] === 0x96, code = String.fromCharCode(head[0xC], head[0xD], head[0xE], head[0xF]);
  if (!isGBA && FE8.dsLayoutsFrom && /^[A-Z0-9]{4}$/.test(code) && head[0x12] <= 3) {
    say(`Reading the DS maps in ${r.name}.`);
    const set = await FE8.dsLayoutsFrom(r.file ? sliceReader(r.file) : (o, n) => Promise.resolve(new Uint8Array(r.buf, o, Math.min(n, r.buf.byteLength - o))));
    if (set) { if (!set.layouts.length) return `${set.title}: no battle maps were found in this file. If it\u2019s a translated or modified copy, tell me which.`;
      FE8.addDsSet(set); idbPutSafe('ds:' + set.code, JSON.stringify(set)); return `Added ${set.title} (${set.layouts.length} maps).`; }
  }
  say(`Reading ${r.name}.`);
  if (!r.buf) r.buf = await r.file.arrayBuffer();
  await sleep(20);
  const res = FE8.addGame(r.buf);
  if (!res.ok) return `${r.name}: ${res.why}`;
  idbPutSafe((res.music ? 'music:' : 'game:') + res.game.code, r.buf);
  if (res.music && OPTS.music !== 'off') { OPTS.music = 'mix'; store.set('ec-opts', JSON.stringify(OPTS)); Music.chapter(); if (st) Music.phase(st.phase || 'player'); }
  return `Added ${res.game.title}${res.music ? ' Music now mixes in its tracks.' : '.'}`;
}
// ---------------------------------------------------------------- music: FE8's soundtrack, plus any SRR build's tracks
const FE8_SONGS = { player: [0x09, 0x0A, 0x0B, 0x0C, 0x0E], enemy: [0x10, 0x11, 0x13, 0x14, 0x15], attack: 0x19, defense: 0x1A, boss: 0x1C, victory: 0x31, defeat: 0x3E, prep: 0x34 };
const Music = (() => {
  const players = new Map(); let phaseSong = null, chapterSongs = null, cur = null, shared = null;
  function context() { if (!shared) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) shared = new AC(); try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {} } return shared; }
  function src(R) { if (!players.has(R)) { const t = MP2K.findMusic(R); players.set(R, t ? { p: MP2K.Player(R, { volume: OPTS.volume / 100, ctx: context }), t } : null); } return players.get(R); }
  function extras() { const out = []; for (const m of FE8.musicRoms()) { const s = src(m.R); if (!s) continue; if (!m.pool) { const u32 = a => (m.R[a] | m.R[a + 1] << 8 | m.R[a + 2] << 16 | m.R[a + 3] << 24) >>> 0; m.pool = [];
        for (let k = 0x47; k < s.t.n; k++) { const h = u32(s.t.off + k * 8) - 0x08000000; if (h > 0 && h < m.R.length && m.R[h] >= 4 && m.R[h] <= 16) m.pool.push(k); } }
      for (const k of m.pool) out.push({ R: m.R, id: k }); } return out; }
  function play(R, id) { if (OPTS.music === 'off' || !useRom) return; const s = src(R); if (!s) return; if (cur && cur.R === R && cur.id === id) return; stopAll(); s.p.setVolume(OPTS.volume / 100); if (s.p.start(id, s.t.off)) cur = { R, id }; }
  function stopAll() { for (const s of players.values()) if (s) s.p.stop(true); cur = null; }
  const base = () => FE8._base().R;
  function pickFor(kind) {
    const mix = OPTS.music === 'mix' ? extras() : [];
    if (mix.length && Math.random() < 0.6) { const e = mix[Math.floor(Math.random() * mix.length)]; return e; }
    const list = FE8_SONGS[kind]; return { R: base(), id: list[Math.floor(Math.random() * list.length)] };
  }
  return {
    unlock() { const c = context(); if (c && c.state !== 'running') c.resume().catch(() => {}); },
    chapter() { chapterSongs = { player: pickFor('player'), enemy: pickFor('enemy') }; },
    phase(team) { if (!chapterSongs) this.chapter(); phaseSong = chapterSongs[team === 'player' ? 'player' : 'enemy']; play(phaseSong.R, phaseSong.id); },
    battle(A, D) { const bossFight = A.boss || D.boss || A.captain || D.captain; play(base(), bossFight ? FE8_SONGS.boss : A.team === 'player' ? FE8_SONGS.attack : FE8_SONGS.defense); },
    afterBattle() { if (phaseSong) play(phaseSong.R, phaseSong.id); },
    result(r) { play(base(), r === 'victory' ? FE8_SONGS.victory : FE8_SONGS.defeat); },
    ctx: () => context(),
    debug() { return { ctx: shared ? shared.state : 'none', playing: cur ? (cur.R === base() ? 'FE8 song ' : 'extra song ') + cur.id : null }; },
    stop: stopAll, volume(v) { for (const s of players.values()) if (s) s.p.setVolume(v / 100); },
    get count() { return extras().length; }
  };
})();
// ---------------------------------------------------------------- sound effects: FE8's own, by the numbers the game uses
const SE = { swordSwing: 201, swordSwing2: 200, lanceSwing: 202, axeSwing: 205, axeSwing2: 234, bowDraw: 209, bowShot: 204, magicCharge: 246, magicFire: 309,
  hit: 210, hitPierce: 212, critical: 216, lastHit: 213, dieAway: 214, miss: 215, heal: 239, exp: 116, statUp: 118, levelUp: 91, turn: 115, chapter: 144, cursor: 101, select: 106, dance: 723 };
const Sfx = (() => { const pool = []; let k = 0;
  const log = {};
  return { log, play(id) { if (!useRom || OPTS.sfx === 'off' || id == null) return; log[id] = (log[id] || 0) + 1; try {
      if (!pool.length) { const R = FE8._base().R, t = MP2K.findMusic(R); if (!t) return; for (let i = 0; i < 3; i++) pool.push({ p: MP2K.Player(R, { volume: OPTS.volume / 100, ctx: () => Music.ctx() }), t }); }
      const s = pool[k++ % pool.length]; s.p.setVolume(OPTS.volume / 100 * 0.9); s.p.start(id, s.t.off); } catch (e) { console.error(e); } } };
})();
function swingSound(u) { const w = u.weapon; return w === 'sword' ? SE.swordSwing : w === 'lance' ? SE.lanceSwing : w === 'axe' ? SE.axeSwing : w === 'bow' ? SE.bowShot : w === 'claw' ? SE.swordSwing2 : (w === 'fire' || w === 'eye' || w === 'breath') ? SE.magicFire : SE.swordSwing2; }
['pointerdown', 'keydown', 'touchstart', 'touchend'].forEach(ev => document.addEventListener(ev, () => Music.unlock(), { passive: true }));
['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
let lastTouchEnd = 0; document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastTouchEnd < 320 && e.target.closest && e.target.closest('.stage')) e.preventDefault(); lastTouchEnd = now; }, { passive: false });
function idbPutSafe(key, val) { try { const p = idb('readwrite', os => os.put(val, key)); if (p && p.catch) p.catch(() => {}); } catch (e) { /* storage is best-effort */ } }
function rebuildLibrary() { E.setRomData({ maps: FE8.maps(window.REPO_MAPS), classes: FE8.classes() }); try { E.setClassPool(FE8.classPool()); } catch (err) { console.error(err); } }
function wireLibrary() { const inp = $('addGame'); if (!inp) return;
  inp.onchange = async e => { const files = [...e.target.files]; inp.value = ''; if (!files.length) return;
    if (!useRom) { libMsg = 'Load Sacred Stones first; it supplies the units and terrain rules.'; renderPanel(); return; }
    const say = m => { libMsg = m; if (tab === 'library') renderPanel(); };
    const before = E.mapCount(), notes = [];
    try {
      say('Opening ' + files.map(f => f.name).join(', ') + '.'); await sleep(30);
      for (const r of await filesToRoms(files)) {
        if (r.none) { notes.push(`${r.name} ${r.none}`); continue; }
        try { notes.push(await addOne(r, say)); } catch (err) { console.error(err); notes.push(`${r.name}: reading stopped with an error (${(err && err.message) || err}).`); }
        await sleep(20);
      }
      say('Rebuilding the map library.'); await sleep(30); rebuildLibrary();
      libMsg = notes.join(' ') + ` The library went from ${before} to ${E.mapCount()} maps.`;
    } catch (err) { console.error(err); libMsg = notes.join(' ') + ` Something went wrong: ${(err && err.message) || err}.`; }
    renderPanel(); }; }
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; document.querySelectorAll('[data-tab]').forEach(o => o.setAttribute('aria-pressed', o === b)); renderPanel(); });

// ---------------------------------------------------------------- controls
function setMode(m) { mode = m; store.set('ec-mode', m); $('mWatch').setAttribute('aria-pressed', m === 'watch'); $('mCommand').setAttribute('aria-pressed', m === 'command');
  if (m === 'watch' && human) finishHuman(true); $('cmdRow').hidden = !(m === 'command' && human); }
$('mWatch').onclick = () => setMode('watch'); $('mCommand').onclick = () => setMode('command');
$('endTurn').onclick = () => { if (human && human.stage !== 'busy') { cancelSelection(); finishHuman(false); } };
$('autoRest').onclick = () => { if (human && human.stage !== 'busy') { cancelSelection(); finishHuman(true); } };
function setTheater(on) { document.body.classList.toggle('theater', on); $('tTheater').setAttribute('aria-pressed', on); $('tTheater').textContent = on ? 'Exit' : 'Full map'; store.set('ec-theater', on ? '1' : ''); }
$('tTheater').onclick = () => setTheater(!document.body.classList.contains('theater'));
$('tPause').onclick = () => $('pauseBtn').click(); $('tSpeed').onclick = () => $('speedBtn').click();
setTheater(store.get('ec-theater') === '1');
$('pauseBtn').onclick = () => { paused = !paused; $('pauseBtn').textContent = paused ? 'Resume' : 'Pause'; $('tPause').textContent = paused ? 'Resume' : 'Pause'; $('pauseBtn').setAttribute('aria-pressed', paused); };
const SPEEDS = [1, 2, 4];
function showSpeed() { $('speedBtn').textContent = `Speed ${speed}\u00d7`; const t = $('tSpeed'); if (t) t.textContent = speed + '\u00d7'; }
$('speedBtn').onclick = () => { speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]; store.set('ec-speed', speed); showSpeed(); };
let newArmed = 0;
$('newBtn').onclick = () => { if (Date.now() - newArmed < 3000) { store.del('ec-save'); abortFlag = true; newArmed = 0; $('newBtn').textContent = 'New run'; return; }
  newArmed = Date.now(); $('newBtn').textContent = 'Tap to confirm'; setTimeout(() => { if (newArmed && Date.now() - newArmed >= 2900) { newArmed = 0; $('newBtn').textContent = 'New run'; } }, 3000); };
showSpeed(); setMode(mode);

// ---------------------------------------------------------------- startup: ROM gate, then continue or begin
function idb(mode2, fn) { return new Promise(res => { try { const rq = indexedDB.open('endless-chronicle', 1);
  rq.onupgradeneeded = () => rq.result.createObjectStore('rom'); rq.onerror = () => res(null);
  rq.onsuccess = () => { try { const tx = rq.result.transaction('rom', mode2), r = fn(tx.objectStore('rom')); tx.oncomplete = () => res(r && r.result); tx.onerror = () => res(null); } catch (e) { res(null); } }; } catch (e) { res(null); } }); }
function startWithRom(buf) {
  const r = FE8.load(buf);
  if (!r.ok) { $('gateMsg').textContent = `That file isn't a clean US Sacred Stones ROM (checksum ${r.crc.toString(16).toUpperCase()}, expected A47246AE). Choose an unpatched copy.`; return false; }
  useRom = true; rebuildLibrary(); applyFeLook(); return true;
}
function applyFeLook() {
  const f = FE8.ui.frame(0, 3, 3, 0), c = document.createElement('canvas'); c.width = 48; c.height = 48; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(f, 0, 0, 48, 48);
  document.documentElement.style.setProperty('--fe-frame', `url(${c.toDataURL()})`);
  const px = f.getContext('2d').getImageData(12, 12, 1, 1).data; document.documentElement.style.setProperty('--fe-fill', `rgb(${px[0]},${px[1]},${px[2]})`);
  document.body.classList.add('fe');
}
function idbAll() { return new Promise(res => { try { const rq = indexedDB.open('endless-chronicle', 1); rq.onupgradeneeded = () => rq.result.createObjectStore('rom');
  rq.onsuccess = () => { const out = []; try { const c = rq.result.transaction('rom', 'readonly').objectStore('rom').openCursor(); c.onsuccess = () => { const cur = c.result; if (cur) { out.push([cur.key, cur.value]); cur.continue(); } else res(out); }; c.onerror = () => res(out); } catch (e) { res(out); } }; rq.onerror = () => res([]); } catch (e) { res([]); } }); }
let started = false;
function begin() {
  if (started) return; started = true; $('gate').hidden = true;
  const saved = store.get('ec-save'); let resume = null;
  try { resume = saved ? E.loadCampaign(saved) : null; } catch (e) { resume = null; }
  const go = c => (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => forever(c));
  if (resume) { show('', `Your army is waiting at Chapter ${resume.chapter + 1}.`);
    setMenu([[`Continue, Chapter ${resume.chapter + 1}`, () => { setMenu([]); go(resume); }, 'primary'], ['New run', () => { setMenu([]); store.del('ec-save'); go(null); }, 'quiet']]); }
  else go(null);

$('romFile').onchange = async e => { const f = e.target.files[0]; if (!f) return; $('gateMsg').textContent = 'Reading the ROM.';
  const buf = await f.arrayBuffer(); if (startWithRom(buf)) { idb('readwrite', os => os.put(buf, 'fe8')); begin(); } };
$('noRom').onclick = () => { useRom = false; begin(); };
window.__ec = { get st() { return st; }, get cam() { return cam; }, get stage() { return human && human.stage; }, get combat() { return !!view.combat; }, get battle() { return !!view.battle; }, get music() { return Music.debug(); }, get sfx() { return Sfx.log; }, get lvl() { return !!view.levelup; }, get exp() { return !!view.expbar; }, get pos() { return view.pos; }, get moves() { return human && human.ranges && human.stage === 'move' ? human.ranges.move : null; }, VW, VH };
requestAnimationFrame(render);
idb('readonly', os => os.get('fe8')).then(async buf => { if (buf && startWithRom(buf)) { for (const [k, v] of await idbAll()) { try { if (String(k).startsWith('game:')) { const res = FE8.addGame(v);
          if (res && res.ds) { const B = new Uint8Array(v), set = await FE8.dsLayoutsFrom((o, n) => Promise.resolve(B.subarray(o, o + n)));

        else if (String(k).startsWith('ds:')) FE8.addDsSet(JSON.parse(v)); else if (String(k).startsWith('music:')) FE8.addGame(v); } catch (e) { console.error(e); } } rebuildLibrary(); begin(); } else { $('gate').hidden = false; show('', 'Load your ROM to begin, or play with simple art.'); } });
})();
