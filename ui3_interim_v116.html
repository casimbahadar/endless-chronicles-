<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Endless Chronicle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito+Sans:opsz,wght@6..12,500;6..12,700;6..12,800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --r:8px; --btn:44px;
  --font:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --display:"Cinzel", Georgia, serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px);
  --bg:#0b1024; --bg2:#16204a; --ink:#f2f4ff;
  --w1:#4766d8; --w2:#24358a; --winInk:#ffffff; --winMuted:#cdd6ff; --edge:#e3e8ff; --edgeDark:#111a50; --rowRule:rgba(230,236,255,.2);
  --gold:#f4cb63; --goldDeep:#c58e1f; --goldInk:#2a1900; --bad:#ff9a88; --good:#8ee6a1; --chip:rgba(10,18,70,.45);
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#ece3cf; --bg2:#f7f1e3; --ink:#2a2140;
  --w1:#fffaf0; --w2:#f1e5c9; --winInk:#2a2140; --winMuted:#6b5a3e; --edge:#8a6a36; --edgeDark:#f9f1df; --rowRule:rgba(110,85,40,.22);
  --gold:#b9781a; --goldDeep:#8a5609; --goldInk:#fffaf0; --bad:#b4321f; --good:#2f7d3e; --chip:rgba(138,106,54,.12); } }
:root[data-theme="light"]{
  --bg:#ece3cf; --bg2:#f7f1e3; --ink:#2a2140;
  --w1:#fffaf0; --w2:#f1e5c9; --winInk:#2a2140; --winMuted:#6b5a3e; --edge:#8a6a36; --edgeDark:#f9f1df; --rowRule:rgba(110,85,40,.22);
  --gold:#b9781a; --goldDeep:#8a5609; --goldInk:#fffaf0; --bad:#b4321f; --good:#2f7d3e; --chip:rgba(138,106,54,.12); }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; min-height:100%; background:radial-gradient(120% 90% at 30% 0%, var(--bg2), var(--bg)); color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.35; -webkit-tap-highlight-color:transparent; }
.app{ max-width:760px; margin:0 auto; padding:var(--s3) var(--s3) var(--s5); display:grid; gap:var(--s3); }
.win{ position:relative; color:var(--winInk); background:linear-gradient(180deg,var(--w1),var(--w2)); border-radius:var(--r);
  box-shadow:inset 0 0 0 2px var(--edge), inset 0 0 0 4px var(--edgeDark), 0 3px 0 rgba(0,0,0,.28); }
.head{ display:flex; align-items:center; justify-content:space-between; gap:var(--s3); padding:var(--s2) var(--s4); }
h1{ margin:0; font-family:var(--display); font-size:21px; font-weight:700; white-space:nowrap; letter-spacing:.6px; }
h1 b{ color:var(--gold); font-weight:700; }
.status{ display:flex; gap:var(--s2); flex-wrap:wrap; justify-content:flex-end; }
.chip{ font-size:13px; font-weight:700; padding:3px var(--s2); border-radius:999px; background:var(--chip); box-shadow:inset 0 0 0 1px var(--rowRule); white-space:nowrap; }
.chip strong{ color:var(--gold); font-weight:600; }
.stage{ position:relative; border-radius:var(--r); overflow:hidden; background:#000; box-shadow:0 0 0 2px var(--edge), 0 0 0 5px var(--edgeDark), 0 6px 18px rgba(0,0,0,.45); touch-action:none; }
canvas#cv{ display:block; width:100%; height:auto; aspect-ratio:3/2; image-rendering:pixelated; }
#menu{ position:absolute; top:var(--s2); right:var(--s2); width:min(42%,230px); display:grid; gap:2px; padding:var(--s2); }
#menu.left{ right:auto; left:var(--s2); } #menu.low{ top:auto; bottom:var(--s2); } #menu:empty{ display:none; }
#menu button{ min-height:40px; width:100%; text-align:left; padding:0 var(--s3); background:transparent; box-shadow:none; color:var(--winInk); font-size:16px; }
#menu button:hover, #menu button:focus-visible{ background:rgba(255,255,255,.14); }
#menu button.primary{ background:rgba(244,203,99,.95); color:#2a1900; }
#menu button.quiet{ color:#d6defc; }
.side{ display:grid; gap:var(--s3); align-content:start; }
.hint{ padding:var(--s3) var(--s4); min-height:62px; font-size:16px; font-weight:600; }
.hint #speaker{ color:var(--gold); font-weight:600; margin-right:var(--s1); }
button{ font-family:var(--font); font-size:15px; font-weight:700; line-height:1; color:var(--winInk); min-height:var(--btn); padding:0 var(--s3); border:0; border-radius:var(--r); cursor:pointer;
  background:linear-gradient(180deg,var(--w1),var(--w2)); box-shadow:inset 0 0 0 2px var(--edge), inset 0 0 0 4px var(--edgeDark); }
button:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
button[aria-pressed="true"]{ color:var(--gold); box-shadow:inset 0 0 0 2px var(--gold), inset 0 0 0 4px var(--edgeDark), 0 0 0 2px rgba(244,203,99,.35); }
button.primary{ background:linear-gradient(180deg,var(--gold),var(--goldDeep)); color:var(--goldInk); box-shadow:inset 0 0 0 2px #fff1c4, inset 0 0 0 4px #7a5310; font-weight:600; }
button.quiet{ background:var(--chip); box-shadow:inset 0 0 0 2px var(--rowRule); color:var(--winInk); }
.bar{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--s2); }
.seg{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--s2); }
#cmdRow{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--s2); } #cmdRow[hidden]{ display:none; }
.tabs{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:var(--s1); }
.tabs button{ font-size:13px; padding:0 2px; min-height:38px; }
#panel{ padding:var(--s2) var(--s4); max-height:320px; overflow:auto; font-size:14px; }
.line{ display:grid; grid-template-columns:1fr auto; gap:var(--s2); padding:7px 0; border-bottom:1px solid var(--rowRule); }
.line:last-child{ border-bottom:0; }
.unit{ display:grid; grid-template-columns:1.2fr 1.1fr auto auto; gap:var(--s2); padding:6px 0; border-bottom:1px solid var(--rowRule); align-items:center; }
.unit:last-child{ border-bottom:0; }
.muted{ color:var(--winMuted); } .good{ color:var(--good); } .bad{ color:var(--bad); } .lord{ color:var(--gold); }
.tag{ font-size:11px; font-weight:700; color:var(--winMuted); }
.opt{ display:grid; gap:var(--s2); padding:var(--s2) 0 var(--s3); border-bottom:1px solid var(--rowRule); }
.opt:last-child{ border-bottom:0; } .opt .seg button{ min-height:38px; font-size:14px; }
#gate p{ margin:var(--s2) 0 var(--s3); } #gate{ padding:var(--s4); } #gate .stack{ display:grid; gap:var(--s2); }
.pick{ position:relative; display:block; } .pick input{ position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer; }
.pick span{ display:flex; align-items:center; justify-content:center; min-height:var(--btn); border-radius:var(--r); font-weight:800; background:linear-gradient(180deg,var(--gold),var(--goldDeep)); color:var(--goldInk); box-shadow:inset 0 0 0 2px #fff1c4, inset 0 0 0 4px #7a5310; }
.pick input:focus-visible + span{ outline:3px solid #fff; outline-offset:2px; }
#gateMsg{ color:#ffe1b0; margin:var(--s2) 0 0; }
.credit a{ color:var(--winInk); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
button{ white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis; }
html, body{ overflow-x:hidden; max-width:100%; touch-action:manipulation; }
.app, .side, .stageWrap, #panel, .hint{ min-width:0; } #panel{ overflow-wrap:anywhere; }
.head{ flex-wrap:wrap; } .head h1{ white-space:normal; }
@media (max-width: 430px){ h1{ font-size:18px; } .chip{ font-size:12px; } button{ font-size:14px; } .tabs button{ font-size:12px; } }
.hint{ display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
/* landscape: the map fills the screen height, controls live in a side panel */
@media (orientation: landscape) and (min-width: 640px){
  body{ height:100%; overflow:hidden; }
  .app{ max-width:none; height:100dvh; padding:var(--s2) var(--s3); column-gap:var(--s3); row-gap:var(--s2);
    grid-template-columns:minmax(0, 1fr) clamp(260px, 30vw, 380px); grid-template-rows:auto minmax(0, 1fr);
    grid-template-areas:"stage head" "stage side"; }
  .head{ grid-area:head; flex-wrap:wrap; justify-content:flex-start; padding:var(--s2) var(--s3); row-gap:var(--s1); }
  .head .status{ justify-content:flex-start; }
  #gate{ grid-area:side; z-index:2; }
  .stageWrap{ grid-area:stage; min-height:0; display:flex; align-items:center; justify-content:center; }
  .stage{ height:100%; max-height:100%; aspect-ratio:3/2; width:auto; max-width:100%; }
  canvas#cv{ height:100%; width:auto; max-width:100%; }
  .side{ grid-area:side; min-height:0; display:flex; flex-direction:column; gap:var(--s2); }
  .side > *{ flex:none; }
  .side #panel{ flex:1 1 auto; min-height:0; max-height:none; overflow:auto; }
  .side button{ font-size:14px; padding:0 6px; min-height:40px; }
  .tabs{ grid-template-columns:repeat(3, 1fr); }
  .hint{ min-height:0; padding:var(--s2) var(--s3); font-size:14px; }
}
@media (orientation: landscape) and (min-width: 640px) and (max-height: 520px){
  .app{ padding:var(--s1) var(--s2); row-gap:var(--s1); column-gap:var(--s2); }
  .head{ padding:var(--s1) var(--s2); } h1{ font-size:15px; } .chip{ font-size:11px; padding:2px 6px; }
  .hint{ -webkit-line-clamp:2; font-size:13px; padding:6px var(--s2); }
  .side{ gap:var(--s1); } .side button{ min-height:32px; font-size:12px; }
  .tabs{ grid-template-columns:repeat(5, 1fr); } .tabs button{ font-size:11px; min-height:30px; }
  #panel{ padding:var(--s1) var(--s2); font-size:12px; } .unit{ padding:3px 0; } .tag{ font-size:10px; }
}
/* theater mode: the map fills the screen; a small toolbar floats over it */
.float{ position:absolute; top:8px; right:8px; display:flex; gap:6px; z-index:3; }
.float button{ min-height:34px; font-size:13px; padding:0 10px; background:rgba(12,18,52,.62); color:#fff; box-shadow:inset 0 0 0 1px rgba(255,255,255,.35); backdrop-filter:blur(4px); }
.float #tPause, .float #tSpeed{ display:none; }
.strip{ display:none; position:absolute; left:8px; right:8px; bottom:8px; padding:6px 12px; font-size:15px; font-weight:700; z-index:2; pointer-events:none; }
body.theater .float #tPause, body.theater .float #tSpeed{ display:inline-flex; align-items:center; }
body.theater .strip.on{ display:block; }
body.theater .side, body.theater .head{ display:none !important; }
body.theater .app{ grid-template-columns:1fr !important; grid-template-areas:"stage" !important; grid-template-rows:1fr !important; height:100dvh; padding:4px !important; }
body.theater .stageWrap{ height:100%; display:flex; align-items:center; justify-content:center; }
body.theater .stage{ width:100%; height:100%; max-height:100%; aspect-ratio:auto; display:flex; align-items:center; justify-content:center; background:#000; }
body.theater canvas#cv{ width:100%; height:100%; max-width:100%; max-height:100%; object-fit:contain; aspect-ratio:auto; }
@media (prefers-reduced-motion: reduce){ *{ transition:none!important; animation:none!important; } }
</style>

    <div id="gateTitle" style="color:var(--gold);font-weight:600">Bring your own Sacred Stones</div>

  <aside class="side">

    <div class="seg" role="group" aria-label="Who plays your army"><button id="mWatch" aria-pressed="true">Watch</button><button id="mCommand" aria-pressed="false">Command</button></div>
    <div id="cmdRow" hidden><button id="endTurn" class="primary">End turn</button><button id="autoRest">Auto finish</button></div>
    <div class="bar"><button id="pauseBtn">Pause</button><button id="speedBtn">Speed 2×</button><button id="newBtn" class="quiet">New run</button></div>

    </div>
    <div id="panel" class="win"></div>
  </aside>
</main>
